
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>College Event Registration</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>TechFest 2026</h1>
        <p>Innovate. Create. Celebrate.</p>
    </header>

    <nav>
        <a href="#home">Home</a>
        <a href="#details">Event Details</a>
        <a href="#register">Register</a>
    </nav>

    <main id="home">
        <section id="details" class="event">
            <h2>Welcome to TechFest!</h2>
            <p>Join us for exciting coding competitions,
               workshops and technical events.</p>

            <p><strong>Date:</strong> 15 December 2026</p>
            <p><strong>Venue:</strong> College Auditorium</p>
        </section>

        <section id="register" class="registration">
            <h2>Register Now</h2>

            <form>
                <label for="name">Full Name</label>
                <input type="text" id="name"
                       placeholder="Enter your name" required>

                <label for="email">Email</label>
                <input type="email" id="email"
                       placeholder="Enter your email" required>

                <label for="phone">Phone Number</label>
                <input type="tel" id="phone"
                       placeholder="Enter phone number" required>

                <label for="date">Event Date</label>
                <input type="date" id="date" required>

                <label for="event">Choose Event</label>
                <select id="event" required>
                    <option value="">Select an event</option>
                    <option value="coding">Coding Competition</option>
                    <option value="web">Web Development</option>
                    <option value="quiz">Tech Quiz</option>
                </select>

                <button type="submit">Submit Registration</button>
            </form>
        </section>
    </main>

    <footer>
        <p>Copyright 2026 TechFest | All Rights Reserved</p>
    </footer>

</body>
</html>
